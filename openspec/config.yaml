schema: spec-driven

context: |
  PROJECT: "Saltopia" - an immersive 3D web experience that lets visitors explore an
  imagined community at the Salto do Rio Caveiras reservoir outside Lages, Santa
  Catarina, Brazil (Serra Catarinense highlands). Fifteen places, each with its own
  page. Academic project for a 5th-semester presentation.
  The change that built it keeps its original name, add-serranopolis-experience.

  REFERENCE: The interaction model is modeled on visitmeatopia.com (Awwwards
  Honorable Mention, Aug 2026). Same architecture and choreography, entirely
  different theme, palette, copy and art. Never copy their assets or text.

  ARCHITECTURE (hub-and-spoke):
  - Home is NOT a scrolling page. It is a fullscreen WebGL canvas holding a
    low-poly 3D neighborhood. The camera drifts over it and flies to points of
    interest. Document height stays at viewport height.
  - Map pins are HTML (div + inline SVG) in an absolutely positioned overlay
    above the canvas, repositioned every frame by projecting 3D world positions
    to 2D screen space. They are NOT 3D sprites.
  - Clicking a pin does not navigate. The camera flies to the location
    (GSAP, duration 2, ease power2.inOut) and a detail card animates in.
    A "VISIT" button inside that card performs the route change.
  - Place pages and recipe/experience pages ARE ordinary long scroll pages with
    no canvas.
  - Route changes use the View Transitions API with a circular iris reveal:
    @keyframes hole { 0% { clip-path: circle(0%) } 100% { clip-path: circle(100%) } }
    applied to ::view-transition-new(root) for 1.5s ease-in, while
    ::view-transition-old(root) has no animation. A .no-transition class
    disables it for reduced-motion users.

  TECH STACK: Next.js 16 (App Router, Turbopack), React 19, TypeScript strict,
  Tailwind CSS v4, three.js, @react-three/fiber, @react-three/drei,
  gsap + @gsap/react (useGSAP), lenis for smooth scroll on content pages.

  DATA: MariaDB accessed through Prisma (provider "mysql" - the connector that
  speaks MariaDB). Database access is confined to a data layer; no component
  imports PrismaClient directly. Schema changes go through versioned migrations.
  Table and column names are snake_case English.

  ENVIRONMENT: local development only for now. A VPS deployment comes later, so
  no server-specific paths, no assumed reverse proxy, no hardcoded domains -
  moving to the VPS must be an .env change, not a code change.

  3D ASSETS: the world is generated in code at runtime from typed layout data -
  terrain, roads, buildings, trees, boats, sky and every texture - so nothing is
  downloaded for it. Araucaria trees - the signature tree of the Serra - are
  generated procedurally in three.js. The only downloaded models are six CC0
  people by Quaternius (from Poly Pizza), used for the visitor's walking
  character and the townsfolk and fetched after the world has been drawn;
  web/public/models/CREDITS.md records their source.

  PAGES: every place page is built around the place's own colour and carries a
  photographed menu (a `menu_item` table, nine items per place). /embaixador is a
  fictional ambassador contest - our take on the reference's "be the mayor" page - and
  a card invites to it once a session. It never collects anything.

  PALETTE: night #1F2346, wine #7B2D3F and champagne #D9BF86 on cream paper. Never the
  reference's orange-red, teal or mustard: tests/palette.test.ts and
  tests/content.test.ts hold every saturated colour at least 0.08 (OKLab) away from
  them. The 3D world keeps its own palette.

  WALK MODE: the visitor creates a character and walks the community; townsfolk
  stroll and stand about it. A walker's feet stand on the drawn geometry, read
  into a height field - never on a height worked out by rule.

  CONVENTIONS:
  - All identifiers, filenames, comments and commit messages in English.
  - All user-facing copy in Brazilian Portuguese.
  - No `any`. No class inheritance - compose instead.
  - Files lowercase-with-hyphen. Components PascalCase. Constants UPPER_SNAKE_CASE.
  - Every animation must respect prefers-reduced-motion.

rules:
  proposal:
    - State explicitly which visitmeatopia.com mechanic each capability mirrors
    - Always include a "Non-goals" section
  design:
    - Record exact animation durations, easings and colour tokens - no vague adjectives
    - Note the WebGL performance budget and the mobile fallback for every 3D decision
